name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
        continue-on-error: true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Build .app bundle with xcodebuild
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Extract .app from archive
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null || true
          # Try to find the .app in the archive
          if [ -d "build/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -R build/Runner.xcarchive/Products/Applications/Runner.app build/
            echo "Found .app in archive"
          fi

      - name: List build output
        run: |
          echo "Checking build output..."
          find . -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app files found"
          ls -la ios/build/ 2>/dev/null || echo "ios/build/ directory not found"

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            ios/build/Runner.app
            ios/build/Runner.xcarchive
            ios/build/ipa
          retention-days: 30
          if-no-files-found: warn

      # Note: IPA building requires code signing setup via GitHub Secrets
      # To enable, add these secrets in repository settings:
      # - APPLE_CERTIFICATE_BASE64
      # - APPLE_CERTIFICATE_PASSWORD
      # - CODE_SIGN_IDENTITY
      # - TEAM_ID
      # Then uncomment and configure the steps below
      
      # - name: Build IPA (requires code signing)
      #   run: |
      #     cd ios
      #     xcodebuild -workspace Runner.xcworkspace \
      #       -scheme Runner \
      #       -configuration Release \
      #       -destination generic/platform=iOS \
      #       -archivePath build/Runner.xcarchive \
      #       archive \
      #       CODE_SIGN_IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}" \
      #       CODE_SIGNING_REQUIRED=YES
      #   env:
      #     DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      #   continue-on-error: true
      #
      # - name: Export IPA
      #   run: |
      #     xcodebuild -exportArchive \
      #       -archivePath ios/build/Runner.xcarchive \
      #       -exportPath ios/build/ipa \
      #       -exportOptionsPlist ios/ExportOptions.plist
