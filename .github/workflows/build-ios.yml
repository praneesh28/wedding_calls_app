name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'  # Matches your current Flutter version
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
        continue-on-error: true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            build/ios/iphoneos/Runner.app
            build/ios/iphoneos/*.app
          retention-days: 30

      - name: Build IPA (if code signing available)
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}" \
            CODE_SIGNING_REQUIRED=YES
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Export IPA (if code signing available)
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath ios/build/Runner.xcarchive \
            -exportPath ios/build/ipa \
            -exportOptionsPlist ios/ExportOptions.plist
        continue-on-error: true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        with:
          name: ios-ipa
          path: ios/build/ipa/*.ipa
          retention-days: 30

