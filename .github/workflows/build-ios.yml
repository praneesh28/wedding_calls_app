name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
        channel: 'stable'
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version
        
    - name: Install CocoaPods dependencies
      run: |
        cd ios
        pod deintegrate || true
        pod cache clean --all || true
        pod install --repo-update
        cd ..
        
    - name: Setup code signing (if certificates provided)
      if: ${{ secrets.CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Decode certificate and provisioning profile from secrets
        echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
        echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Apply provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
        
    - name: Make build script executable
      run: chmod +x ios/build_ipa.sh || true
      
    - name: Build IPA using custom script
      run: |
        cd ios
        ./build_ipa.sh || bash build_ipa.sh
        cd ..
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      continue-on-error: false
      
    - name: Copy IPA to Flutter build directory
      run: |
        mkdir -p build/ios/ipa
        cp ios/build/ipa/*.ipa build/ios/ipa/ || true
      
    - name: Verify IPA was created
      run: |
        echo "Checking for IPA file..."
        if ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
          echo "✓ IPA file found in build/ios/ipa/:"
          ls -lh build/ios/ipa/*.ipa
        elif ls ios/build/ipa/*.ipa 1> /dev/null 2>&1; then
          echo "✓ IPA file found in ios/build/ipa/:"
          ls -lh ios/build/ipa/*.ipa
          echo "Copying to build/ios/ipa/..."
          mkdir -p build/ios/ipa
          cp ios/build/ipa/*.ipa build/ios/ipa/
        else
          echo "✗ IPA file not found"
          echo "Listing directories:"
          find . -name "*.ipa" -o -name "*.xcarchive" | head -20
          exit 1
        fi
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: build/ios/ipa/*.ipa
        retention-days: 30
        if-no-files-found: error
