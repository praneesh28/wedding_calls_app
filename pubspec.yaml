name: wedding_calls_app
description: Expense Manager - Track your income and expenses

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  google_fonts: ^6.3.0
  csv: ^5.1.1
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  file_picker: ^10.3.3
  fl_chart: ^0.69.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true  # ✅ Material Icons enable ചെയ്യാൻ നിർബന്ധം
  assets:
    - assets/fonts/NotoSansMalayalam[wdth,wght].ttf
    - assets/icon/
  fonts:
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam[wdth,wght].ttf

